name: Recent commits

# Rewrites the block between the RECENT_COMMITS markers in README.md.
# See tools/recent_commits.py — it reads the commit search API, which indexes
# each repo's DEFAULT BRANCH ONLY. Work on a feature branch will not appear here
# until it merges.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recent-commits
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rewrite the block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 tools/recent_commits.py

      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet && echo "No change." && exit 0
          git commit -m "Update recent commits"
          git push
